<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .full{
              width: 100%;
              height: 3162px;
              color: #FFFFFF;
              margin: 0 auto;
              gap: 0;
              display: flex;
              flex-direction: column;
        }
        .header{
            width: 100%;
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
            gap: 30px;
            padding: 15px 0;
            box-sizing:border-box;
        }
        .logo{
            display:flex;
            align-items: center;
            justify-content: center;
            width:200px;
            height:60px;
            font-size: 20px;
            font-weight: bold;
            text-align:center;
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color:#E2E2E2;
            color:#333333;
            border-radius:8px;
        }
        .menu{
            width:820px;
            height:34px;
            font-size: 20px;
            font-weight: bold;
            text-align:center;
            font-family: 'Be Vietnam Pro', sans-serif;
            color:#333333;
            background-color:#E2E2E2;
            border-radius: 8px;
            display: flex; 
            align-items: center;
            justify-content: center;
        }
        .button{
            width:120px;
            height: 42px;
            color:#333333;
            background-color:#E2E2E2;
            font-weight:bold;   
            font-size:20px;
            display:flex;
            align-items:center;
            justify-content: center;
            border-radius:8px;
        }
        .box1{
            width: 100%;
            height:680px;
            background-color:#F1F1F1;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:30px;
        }
        .content{
            width:585px;
            height: 267px;
            background-color:#E2E2E2;
            font-size:20px;
            font-weight:bold;
            color:#333333;
            border-radius:8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image1{
            width:585px;
            height:520px;
            border-radius:8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:#E2E2E2;
            color:#333333;
        }
        .section-2 {
            width: 100%;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;    
            padding-top: 60px;
            padding-bottom: 60px;
            gap: 30px;             
        }
        .title{
            width:600px;
            height:80px;
            border-radius:8px;
            background-color:#E2E2E2;
            color:#333333;
            display:flex;
            align-items:center;
            justify-content:center;
            margin: 0 auto;
            font-family: 'Lora', serif;
            font-size:20px;
            font-weight:bold;        
        }
        .box2 {
            display: flex;
            flex-wrap: wrap;                
            justify-content: center; 
            gap: 30px;                      
            width: 100%;
            max-width:1200px;
        }
        .card{
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:bold;
            width:380px;
            height:420px;
            border-radius: 8px;
            background-color:#E2E2E2;
            color:#333333
        }
        .section-3 {
            width: 100%;
            height:580px;
            background-color: #F1F1F1; 
            display: flex;
            flex-direction: column;
            align-items: center;      
            padding: 60px 0;          
            gap: 38px;                 
        }
        .box3{
            width:100%;        
            max-width:1200px;
            background-color:#F1F1F1;
            gap:30px;   
            display: flex;
            justify-content: center;
        }
        .card2{   
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:bold;
            width:216px;
            height:300px;
            border-radius: 8px;
            background-color:#E2E2E2;
            color:#333333
        }   
        .section-4{
            width:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            background-color:#FFFFFF;
            gap:30px;
            padding: 60px 0;
        }
        .box4{
            width:100%;
            background-color:#FFFFFF;
            color:#333333;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            font-weight:bold;
            gap:30px;
        }
        .card3{
            width:277.5px;
            height:300px;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            background-color:#E2E2E2;
            color:#333333;
        }
        .footer{
            width:100%;
            height:72px;
            background-color:#D9D9D9;
            color:#333333;
            font-weight:bold;
            font-size:20px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
    </style>
</head>
<body>
    <div class="full">
        <div class="header">
            <div class="logo">Logo</div>
            <div class="menu">Menu</div>
            <div class="button">Button</div>
        </div>
        <div class="box1">
            <div class="content">Content</div>
            <div class="image1">Image</div>
        </div>
        <section class="section-2">
        <div class="title">Title</div>
        <div class="box2">
            <div class="card">Item</div>
            <div class="card">Item</div>
            <div class="card">Item</div>
            <div class="card">Item</div>
            <div class="card">Item</div>
            <div class="card">Item</div>   
        </div>
        </section>
        <section class="section-3">
            <div class="title">Title</div>
        <div class="box3">
            <div class="card2">Item</div>
            <div class="card2">Item</div>
            <div class="card2">Item</div>
            <div class="card2">Item</div>
            <div class="card2">Item</div>
        </div>
    </section>
    <section class="section-4">
        <div class="title">Title</div>
        <div class="box4">
            <div class="card3">Item</div>
            <div class="card3">Item</div>
            <div class="card3">Item</div>
            <div class="card3">Item</div>
        </div>
    </section>
    <div class="footer">Footer</div>
    </div>
</body>
</html>
